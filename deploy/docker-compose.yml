# ============================================================
# FINE-APIHUB 服务器部署：面板 +（可选）Watchtower 自动更新
# ============================================================
# 默认 SQLite：数据库就是挂载到宿主机的 ./db-data/fine-apihub.db，复制该文件即完成备份。
# 设 DB_DRIVER=mysql 并填 DB_* 可切到外部 MySQL 实例（完整变量见仓库根的 .env.example）。
#
# ⚠️ 本仓库**没有预构建镜像**：
#   - `ghcr.io/flowleaves/fine-apihub` 尚未发布（本仓已移除 Docker CI，只做本地部署）；
#   - 上游 `ghcr.io/lettimepassby/relay-monitor` 是 MySQL 时期的旧版，与 v2 的 SQLite 不兼容。
#   因此这里用 `build:` 从源码构建。将来若把镜像发布到上面的名字，可改为 `docker compose pull`，
#   并启用文件末尾的 watchtower 段做自动更新。
#
# 用法（在本文件所在目录执行，需要源码）：
#   cd fine-apihub/deploy
#   docker compose up -d --build
# 访问 http://<服务器>:8787 ，默认账号 admin / admin123（**请立即改密码**）
# 数据落在 deploy/db-data/ ；升级 = git pull 后再 docker compose up -d --build
# 首次从 v1（JSON 文件版）迁移：把 v1 的 data/ 放到仓库根的 data/，保持下面 V1_DATA_DIR 挂载即可自动一次性导入
# ============================================================
services:
  fine-apihub:
    # 有 build 段时，本地镜像不存在会自动构建并打上这个 tag；将来发布到 GHCR 后亦可直接 pull。
    image: ghcr.io/flowleaves/fine-apihub:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fine-apihub
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # 「今日消耗 / 用量统计」的日期边界按此时区计算（镜像内已装 tzdata）
      - TZ=Asia/Shanghai
      # 日报的统计日界线与定时发送时区（未设置时也默认 Asia/Shanghai）
      - REPORT_TIME_ZONE=Asia/Shanghai
      # ---- 数据库：sqlite（默认）或 mysql ----
      - DB_DRIVER=sqlite
      - DB_PATH=/app/data/fine-apihub.db
      # ---- 切到外部 MySQL 时取消下面注释，并把上面的 DB_DRIVER 改成 mysql ----
      # - DB_HOST=127.0.0.1
      # - DB_PORT=3306
      # - DB_USER=relay
      # - DB_PASSWORD=
      # - DB_NAME=relay_monitor
      # ---- v1 数据一次性迁移（可选）：导入完成后可删掉本行与下面第二条只读挂载 ----
      - V1_DATA_DIR=/app/v1-data
    volumes:
      # SQLite 库与 WAL 文件放宿主机：升级 / 重建容器不丢数据
      - ./db-data:/app/data
      # v1 旧版 data/（仓库根目录）；不存在也只是跳过导入，不会报错
      - ../data:/app/v1-data:ro

