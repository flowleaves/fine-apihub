# 服务器部署：面板 + Watchtower 自动更新
# 默认使用 SQLite；设置 DB_DRIVER=mysql 并填写 DB_* 可切换到外部 MySQL。
# 首次切换 v2：把 v1 的 data/ 目录只读挂载进来并设 V1_DATA_DIR，库为空时启动自动一次性导入。
# 用法：mkdir -p ~/fine-apihub && cp docker-compose.yml ~/fine-apihub/ && cd ~/fine-apihub && docker compose up -d
services:
  fine-apihub:
    image: ghcr.io/lettimepassby/fine-apihub:latest
    container_name: fine-apihub
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # 「今日消耗 / 用量统计」的日期边界按此时区计算
      - TZ=Asia/Shanghai
      # 日报的统计日界线与定时发送时区（未设置时也默认 Asia/Shanghai）
      - REPORT_TIME_ZONE=Asia/Shanghai
      # ---- 数据库：sqlite（默认）或 mysql ----
      - DB_DRIVER=sqlite
      - DB_PATH=/app/data/fine-apihub.db
      - DB_HOST=change-me
      - DB_PORT=3306
      - DB_USER=relay
      - DB_PASSWORD=change-me
      - DB_NAME=relay_monitor
      # ---- v1 数据一次性迁移（可选）：导入完成后可删除这两行 ----
      - V1_DATA_DIR=/app/v1-data
    volumes:
      - ./data:/app/v1-data:ro
      - ./db-data:/app/data

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR 私有镜像：把 docker login 的凭证挂给 watchtower
      #（用 sudo docker login 登录的话凭证在 /root/.docker/config.json）
      - /root/.docker/config.json:/config.json:ro
    environment:
      # 新版 Docker 守护进程要求 API >= 1.40，watchtower 默认协商值过老
      - DOCKER_API_VERSION=1.44
    # 每分钟检查一次 fine-apihub 的新镜像，更新后清理旧镜像
    command: --cleanup --interval 60 fine-apihub
